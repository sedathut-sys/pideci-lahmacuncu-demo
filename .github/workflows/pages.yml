name: Pideci-Lahmacuncu Demo — Test ve GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bağımlılıkları yükle
        run: npm install --no-audit --no-fund
      - name: Sipariş ve panel çekirdek testleri
        run: npm test
      - name: Demo kaynak güvenlik ve alt-yol denetimi
        run: npm run quality
      - name: Demo Astro derlemesi
        run: npm run build
        env:
          PUBLIC_DATA_MODE: demo
          PUBLIC_SITE_READY: 'false'
          PUBLIC_SITE_URL: 'https://sedathut-sys.github.io/pideci-lahmacuncu-demo/'
      - name: Sayfa çıktısını doğrula
        run: node scripts/check-pages-output.mjs
      - name: GitHub Pages ayarları
        uses: actions/configure-pages@v5
      - name: Statik site dosyalarını yayın için yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages yayınla
        id: deployment
        uses: actions/deploy-pages@v5
